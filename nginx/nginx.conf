worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # حماية DDOS
    limit_req_zone $binary_remote_addr zone=search_zone:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=addr_zone:10m;

    server {
        listen 443 ssl http2;
        server_name search.your-domain.com;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.3;
        ssl_ciphers CHACHA20+ECDHE:!aNULL:!MD5;

        # حماية الرؤوس
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # تطبيق الحماية
        limit_req zone=search_zone burst=10 nodelay;
        limit_conn addr_zone 5;

        location / {
            proxy_pass http://auth-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /search {
            proxy_pass http://aggregator:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /static/ {
            alias /usr/share/nginx/html/;
        }
    }

    server {
        listen 80;
        server_name search.your-domain.com;
        return 301 https://$server_name$request_uri;
    }
}