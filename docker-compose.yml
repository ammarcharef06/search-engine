version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - auth
      - aggregator

  redis:
    image: redis:alpine
    command: redis-server --appendonly yes

  auth:
    build: ./auth-service
    environment:
      - SALT=${SALT}
      - API_KEYS_FILE=/run/secrets/api_keys.enc
    secrets:
      - api_keys.enc
    ports:
      - "8081:8081"

  aggregator:
    build: ./aggregator
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "8082:8082"